name: Validate Web Tools and publish approved release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formatting, lint, tests and static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Bootstrap lockfile when absent (temporary, not release-ready)
        if: hashFiles('package-lock.json') == ''
        run: |
          echo '::warning::package-lock.json is not committed. Run scripts/relock.sh locally and commit it.'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked development dependencies
        id: deps
        run: npm ci --ignore-scripts --no-fund
      - name: Enforce Prettier formatting
        id: format
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run format:check
      - name: Enforce JavaScript lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint:js
      - name: Enforce HTML validation
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run lint:html
      - name: Validate local routes and imports
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:routes
      - name: Enforce static security patterns
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:security
      - name: Validate SVG assets and hostile input tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run check:svg
      - name: Enforce Vitest unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm test
      - name: Enforce independent Node smoke tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test:smoke
      - name: Generate formatting repair patch when Prettier fails
        id: format_repair
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        run: |
          npm run format
          git diff --binary -- . ':!package-lock.json' > prettier-format.patch
          test -s prettier-format.patch
      - name: Upload proposed formatting changes (diagnostic only)
        if: ${{ !cancelled() && steps.format_repair.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-tools-prettier-repair
          path: prettier-format.patch
          if-no-files-found: error
          retention-days: 14
      - name: Upload resolved lockfile even when a quality check fails
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-tools-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 14

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history for scanning
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Bootstrap lockfile when absent (temporary, not release-ready)
        if: hashFiles('package-lock.json') == ''
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked development dependencies
        id: deps
        run: npm ci --ignore-scripts --no-fund
      - name: Enforce high-severity dependency audit
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm audit --audit-level=high
      - name: Scan full repository history for secrets (standalone Gitleaks)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS_VERSION='8.30.1'
          GITLEAKS_SHA256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          GITLEAKS_TAR="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${GITLEAKS_TAR}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${GITLEAKS_TAR}" | sha256sum --check --status
          tar -xzf "${GITLEAKS_TAR}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner --log-opts='--all' .

  deploy:
    name: Manual, owner-approved GitHub Pages release only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exactly the verified source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require committed lockfile before release
        run: |
          git ls-files --error-unmatch package-lock.json >/dev/null
          test -s package-lock.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Confirm only expected public routes are published
        run: |
          test -f public/index.html
          test -f public/sri-hash/index.html
          test ! -f public/CNAME
      - name: Upload only the static public root
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public/
      - name: Deploy approved artefact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
