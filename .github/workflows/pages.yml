name: Validate Web Tools and publish approved release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-tools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Unit tests, source validation and routes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Enforce all quality and unit checks
        run: npm run check
      - name: Independent Node smoke checks
        run: npm run test:smoke

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history for scanning
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Enforce high-severity dependency audit
        run: npm audit --audit-level=high
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Manual, owner-approved GitHub Pages release only
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [quality, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exactly the verified source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Confirm only expected public routes are published
        run: |
          test -f public/index.html
          test -f public/sri-hash/index.html
          test ! -f public/CNAME
      - name: Upload only the static public root
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public/
      - name: Deploy approved artefact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
